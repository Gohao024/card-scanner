name: Update prices and publish app

on:
  # Every day at 21:40 UTC (1:40 pm Pacific), after TCGCSV's daily refresh.
  schedule:
    - cron: "40 21 * * *"
  # Run it by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      psa_only:
        description: "Only refresh PSA numbers (re-use today's prices)"
        type: boolean
        default: false
      force:
        description: "Download fresh prices even if nothing changed"
        type: boolean
        default: false
  # Republish when the app or your PSA links change.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "psa-links.json"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build price data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          EVENT: ${{ github.event_name }}
          PSA_ONLY: ${{ inputs.psa_only || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python scripts/build_prices.py site/data

      - name: Build PSA population data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PSA_TOKEN: ${{ secrets.PSA_TOKEN }}
        run: python scripts/build_psa.py site/data psa-links.json

      - name: Add the app
        run: cp -r app/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
