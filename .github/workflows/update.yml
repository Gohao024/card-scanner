name: Update prices and publish app

on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      psa_only:
        description: "Only refresh PSA numbers (re-use today's prices)"
        type: boolean
        default: false
      force:
        description: "Download fresh prices even if nothing changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "psa-links.json"
      - "psa-requests.json"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build price data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          EVENT: ${{ github.event_name }}
          PSA_ONLY: ${{ inputs.psa_only || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python scripts/build_prices.py site/data
      - name: Build PSA population data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PSA_TOKEN: ${{ secrets.PSA_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python scripts/build_psa.py site/data .
      - name: Add the app
        run: cp -r app/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep daily updates running
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep daily price updates running"
            git push
          else
            echo "Recent activity; nothing to do."
          fi
